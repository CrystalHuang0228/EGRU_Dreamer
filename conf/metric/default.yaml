log_level: 1
log_every: 1000
# Global metric settings
sync_on_compute: False

aggregator:
  _target_: Utils.MetricAggregator
  raise_on_missing: False
  
  metrics:
    # --- Training Losses ---
    Loss/world_model_loss: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Loss/observation_loss: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Loss/reward_loss: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Loss/state_loss: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Loss/continue_loss: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Loss/policy_loss: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Loss/value_loss: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}

    # --- State Metrics ---
    State/kl: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    State/post_entropy: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    State/prior_entropy: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    State/egru_firing_rate: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}

    # --- Gradients ---
    Grads/world_model:
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Grads/actor: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Grads/critic: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}

    # --- Game/Environment Metrics ---
    Rewards/rew_avg: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}
    Game/ep_len_avg: 
      _target_: torchmetrics.MeanMetric
      sync_on_compute: ${metric.sync_on_compute}